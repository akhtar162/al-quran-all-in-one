<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Tidak Ditemukan - 404</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen font-sans text-gray-800">

    <div class="max-w-lg w-full p-8 text-center">
        <!-- Ilustrasi SVG -->
        <div class="animate-float mb-8 flex justify-center">
            <svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="100" cy="100" r="90" fill="#E0E7FF"/>
                <path d="M65 115C65 115 80 130 100 130C120 130 135 115 135 115" stroke="#4F46E5" stroke-width="8" stroke-linecap="round"/>
                <circle cx="70" cy="85" r="10" fill="#4F46E5"/>
                <circle cx="130" cy="85" r="10" fill="#4F46E5"/>
                <path d="M150 40L160 50M160 40L150 50" stroke="#EF4444" stroke-width="4" stroke-linecap="round"/>
                <path d="M40 150L50 160M50 150L40 160" stroke="#EF4444" stroke-width="4" stroke-linecap="round"/>
            </svg>
        </div>

        <h1 class="text-6xl font-extrabold text-indigo-600 mb-4">404</h1>
        <h2 class="text-2xl font-bold text-gray-900 mb-2">Oops! Halaman Tidak Ditemukan</h2>
        <p class="text-gray-600 mb-8">
            Maaf, halaman yang Anda cari tidak ada atau telah dipindahkan.
            <br>
            Anda akan dialihkan ke beranda dalam <span id="countdown" class="font-bold text-indigo-600 text-lg">5</span> detik.
        </p>

        <!-- Tombol Manual -->
        <a href="https://easysearch.site/" class="inline-flex items-center justify-center px-6 py-3 border border-transparent text-base font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 transition-colors duration-300 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 shadow-lg hover:shadow-xl">
            Ke oase Sekarang
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ml-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6" />
            </svg>
        </a>
    </div>

    <script>
        // Konfigurasi Target URL
        const targetUrl = "https://easysearch.site/";
        
        // Waktu hitung mundur (dalam detik)
        let timeLeft = 15;
        
        const countdownElement = document.getElementById('countdown');

        // Fungsi timer
        const timer = setInterval(() => {
            timeLeft--;
            countdownElement.textContent = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(timer);
                window.location.href = targetUrl;
            }
        }, 1000);

        // Jika user mengklik tombol sebelum waktu habis, timer tetap berjalan di background
        // tapi browser akan pindah halaman, jadi tidak masalah.
    </script>

</body>
</html>
